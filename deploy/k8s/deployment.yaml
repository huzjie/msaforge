apiVersion: apps/v1
kind: Deployment
metadata:
  name: msaforge
  labels:
    app: msaforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: msaforge
  template:
    metadata:
      labels:
        app: msaforge
    spec:
      containers:
        - name: msaforge
          image: huzjie/msaforge:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
